name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify tests, drills, and attack regressions
        run: python scripts/verify.py
      - name: Preserve property/fuzz seeds and counterexamples
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: property-fuzz-evidence
          path: .tmp/property-fuzz
          if-no-files-found: error
          retention-days: 14
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: spring-companion/pom.xml
      - name: Verify Spring Security companion
        run: mvn --batch-mode --file spring-companion/pom.xml verify
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Verify browser JavaScript
        run: |
          node --check docs/assets/lab.js
          node --check docs/assets/pyodide-lab.js
          node --check docs/assets/pyodide-policy.js
          node --check docs/assets/pyodide-worker.js
          node --check docs/assets/sequences.js
          node --check docs/assets/webauthn-lab.js
          node --check site/app.js
          node --test tests/browser/*.test.js
      - name: Verify native WebAuthn with a virtual authenticator
        run: node tests/browser/webauthn-e2e.mjs
      - name: Verify interoperability Pages explorer
        run: node tests/browser/interop-gui-e2e.mjs
      - name: Build browser Python source bundle
        run: python scripts/build_pyodide_bundle.py --output .tmp/pyodide/authlab-pyodide.zip
      - name: Verify real authlab Python in Pyodide
        run: |
          cp .tmp/pyodide/authlab-pyodide.zip docs/assets/authlab-pyodide.zip
          node tests/browser/pyodide-e2e.mjs
      - name: Preserve browser GUI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-gui-evidence
          path: .tmp/browser-evidence
          if-no-files-found: warn
          retention-days: 14
      - name: Build learning bundle
        run: python scripts/build_zip.py
      - uses: actions/upload-artifact@v7
        with:
          name: auth-lab-learning-bundle
          path: dist/auth-lab-learning-bundle.zip
          if-no-files-found: error
