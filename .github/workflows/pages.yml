name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build browser Python source bundle
        run: python scripts/build_pyodide_bundle.py

      # Docs-only build dependency. The lab itself still needs no pip install;
      # this runs here so docs/*.md becomes real HTML instead of being served
      # as raw Markdown, which is what the site did before.
      - name: Install the docs toolchain
        run: pip install -r requirements-docs.txt

      - name: Build the site (MkDocs, strict)
        run: python -m mkdocs build --strict

      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
