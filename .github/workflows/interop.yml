name: Real product interoperability

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate local-only profile
        run: |
          docker compose -f interop/compose.yaml config --quiet
          python -m unittest tests.test_interop
      - name: Verify OIDC, SAML, LDAP, and Kerberos products
        run: python scripts/run_interop.py --start
      - name: Preserve redacted interoperability evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: real-product-interop-redacted-evidence
          path: .tmp/interop/trace.jsonl
          if-no-files-found: error
          retention-days: 14
