name: Release

# Pushing a v* tag cuts the release: verify everything first, then publish the
# GitHub Release with the learning bundle attached. Verification runs again
# here on purpose -- a tag can be pushed at a commit CI never saw.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, created at the chosen ref if absent. Defaults to v<authlab.__version__>."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # On a tag push, check out the tag. On a manual run, check out the
          # branch it was dispatched from and tag that commit below.
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify tests, drills, attack regressions, and fuzz campaign
        run: python scripts/verify.py

      - name: Resolve the tag and check it matches authlab.__version__
        id: tag
        run: |
          version="v$(python -c 'import authlab; print(authlab.__version__)')"
          tag="${{ inputs.tag }}"
          tag="${tag:-${{ github.event_name == 'push' && github.ref_name || '' }}}"
          tag="${tag:-$version}"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $tag does not match authlab.__version__ ($version)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "releasing $tag"

      - name: Create the tag if it does not exist yet
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists on the remote"
          else
            git tag -a "$TAG" -m "auth-lab $TAG"
            git push origin "refs/tags/$TAG"
          fi

      - name: Build the learning bundle
        run: python scripts/build_zip.py

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/auth-lab-learning-bundle.zip \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/auth-lab-learning-bundle.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "auth-lab $TAG" \
              --generate-notes
          fi
